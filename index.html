<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><meta name="description" content="Pembaca manga bahasa Indonesia yang bersih dan ringan, ditenagai MangaDex.">
<title>Ruang Manga</title>
<style>
:root{--ink:#0d0d0d;--muted:#666;--line:rgba(0,0,0,.08);--soft:#f5f5f5;--green:#18e299;--max:1180px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(var(--max),calc(100% - 32px));margin:auto}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}nav{height:68px;display:flex;align-items:center;gap:16px}.brand{font-size:20px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}.brand i{display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;background:var(--green)}form{display:flex;flex:1;max-width:620px;margin-left:auto}.search{width:100%;border:1px solid var(--line);border-radius:999px;padding:11px 17px;outline:none;background:#fff}.search:focus{border-color:#0fa76e;box-shadow:0 0 0 3px rgba(24,226,153,.18)}.hero{padding:64px 0 36px;background:radial-gradient(circle at 50% 0,rgba(24,226,153,.2),transparent 43%)}.eyebrow{font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#0a895b}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-2px;margin:10px 0}.hero p{max-width:590px;color:var(--muted);font-size:17px;margin:0}.bar{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:34px 0 20px}.bar h2{font-size:24px;letter-spacing:-.5px;margin:0}.bar p{color:var(--muted);margin:4px 0 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px 16px}.card{border:0;background:none;padding:0;text-align:left;min-width:0}.cover{aspect-ratio:2/3;width:100%;object-fit:cover;background:var(--soft);border-radius:16px;border:1px solid var(--line);transition:.2s transform,.2s box-shadow}.card:hover .cover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.1)}.title{display:block;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:block;color:var(--muted);font-size:13px}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:16px;padding:36px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:center;gap:8px;padding:38px 0 60px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 17px}.pill.primary{background:var(--ink);color:#fff}.pill:disabled{opacity:.35;cursor:not-allowed}.detail{display:grid;grid-template-columns:190px 1fr;gap:32px;padding:44px 0}.detail .cover{width:190px}.detail h1{font-size:clamp(28px,5vw,46px);letter-spacing:-1.5px;line-height:1.1;margin:0 0 12px}.desc{color:#444;max-width:760px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.chapters{border-top:1px solid var(--line);margin-bottom:60px}.chapter{display:flex;justify-content:space-between;gap:14px;width:100%;padding:15px 2px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.chapter:hover{color:#0a895b}.chapter small{color:var(--muted);white-space:nowrap}.reader{background:#151515;min-height:100vh;color:#fff}.readerbar{position:sticky;top:0;z-index:20;background:rgba(15,15,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid #333}.readerbar .shell{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}.readerbar strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.readerbar button{color:#fff;background:#272727;border:1px solid #444}.pages{max-width:980px;margin:auto}.pages img{display:block;width:100%;height:auto;min-height:120px;background:#222}.readernav{display:flex;justify-content:center;gap:10px;padding:30px}.status{padding:70px 16px;text-align:center;color:var(--muted)}.spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:13px}a{color:inherit}@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){nav{height:auto;padding:12px 0;flex-wrap:wrap}.brand{width:100%}form{max-width:none}.hero{padding:42px 0 24px}.grid{grid-template-columns:repeat(3,1fr);gap:18px 10px}.detail{grid-template-columns:110px 1fr;gap:18px;padding:30px 0}.detail .cover{width:110px}.desc{grid-column:1/-1}.bar{align-items:start}.chapter{padding:13px 2px}}@media(max-width:390px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script>
const API='/api',app=document.querySelector('#app');let page=0,lastTotal=0,currentManga=null,currentChapters=[];
const el=(tag,props={},children=[])=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else if(v!==null&&v!==false)n.setAttribute(k,v)}for(const c of children)n.append(c);return n};
const loading=(dark=false)=>{app.className=dark?'reader':'';app.replaceChildren(el('div',{class:'status'},[el('div',{class:'spinner'}),el('div',{text:'Memuat…'})]))};
const request=async path=>{const r=await fetch(API+path);if(!r.ok)throw Error(`MangaDex merespons ${r.status}`);return r.json()};
const titleOf=m=>m.attributes.title.id||m.attributes.title.en||Object.values(m.attributes.title)[0]||'Tanpa judul';
const coverOf=m=>{const c=m.relationships.find(x=>x.type==='cover_art');return c?.attributes?.fileName?`https://uploads.mangadex.org/covers/${m.id}/${c.attributes.fileName}.256.jpg`:''};
const date=id=>new Intl.DateTimeFormat('id-ID',{dateStyle:'medium'}).format(new Date(id));
function layout(content){app.className='';const input=el('input',{class:'search',type:'search',name:'q',placeholder:'Cari manga…',value:new URLSearchParams(location.hash.split('?')[1]).get('q')||'','aria-label':'Cari manga'});const form=el('form',{onsubmit:e=>{e.preventDefault();page=0;location.hash=`#/?q=${encodeURIComponent(input.value.trim())}`}},[input]);const main=el('main',{},[content]);app.replaceChildren(el('header',{},[el('nav',{class:'shell'},[el('div',{class:'brand'},[el('i'),document.createTextNode('Ruang Manga')]),form])]),main,el('footer',{},[el('div',{class:'shell',text:'Data dan gambar disediakan MangaDex. Tidak menyimpan atau mengunggah komik.'})]));}
async function home(){loading();try{const q=new URLSearchParams(location.hash.split('?')[1]).get('q')||'';const params=new URLSearchParams({limit:'20',offset:String(page*20)});params.append('availableTranslatedLanguage[]','id');params.append('includes[]','cover_art');params.append('contentRating[]','safe');params.append('contentRating[]','suggestive');params.append('contentRating[]','erotica');if(q){params.set('title',q);params.append('order[relevance]','desc')}else params.append('order[latestUploadedChapter]','desc');const j=await request('/manga?'+params);lastTotal=j.total;const grid=el('div',{class:'grid'});for(const m of j.data){const img=el('img',{class:'cover',src:coverOf(m),alt:`Sampul ${titleOf(m)}`,loading:'lazy'});img.onerror=()=>{img.removeAttribute('src')};grid.append(el('button',{class:'card',onclick:()=>location.hash='#/manga/'+m.id},[img,el('span',{class:'title',text:titleOf(m)}),el('span',{class:'meta',text:m.attributes.status==='completed'?'Tamat':'Berjalan'})]))}if(!j.data.length)grid.append(el('div',{class:'empty',text:'Manga tidak ditemukan.'}));const hero=el('section',{class:'hero'},[el('div',{class:'shell'},[el('span',{class:'eyebrow',text:'Bahasa Indonesia · tanpa iklan'}),el('h1',{text:'Baca nyaman. Fokus cerita.'}),el('p',{text:'Koleksi terjemahan Indonesia dari MangaDex dalam pembaca ringan, bersih, dan ramah ponsel.'})])]);const section=el('section',{class:'shell'},[el('div',{class:'bar'},[el('div',{},[el('h2',{text:q?`Hasil “${q}”`:'Terbaru diperbarui'}),el('p',{text:`${j.total.toLocaleString('id-ID')} manga tersedia`})])]),grid,el('div',{class:'pager'},[el('button',{class:'pill',text:'Sebelumnya',disabled:page===0?'':null,onclick:()=>{page--;home();scrollTo(0,0)}}),el('button',{class:'pill primary',text:'Berikutnya',disabled:(page+1)*20>=lastTotal?'':null,onclick:()=>{page++;home();scrollTo(0,0)}})])]);layout(el('div',{},[hero,section]));}catch(e){showError(e)}}
async function manga(id){loading();try{const [m,f]=await Promise.all([request(`/manga/${id}?includes[]=cover_art`),request(`/manga/${id}/feed?translatedLanguage[]=id&order[chapter]=desc&limit=100&includes[]=scanlation_group&contentRating[]=safe&contentRating[]=suggestive&contentRating[]=erotica`)]);currentManga=m.data;currentChapters=f.data;const a=m.data.attributes,box=el('div',{class:'chapters'});for(const c of f.data){const group=c.relationships.find(x=>x.type==='scanlation_group')?.attributes?.name||'Kontributor';box.append(el('button',{class:'chapter',onclick:()=>location.hash=`#/read/${c.id}`},[el('span',{text:`Chapter ${c.attributes.chapter||'?'}${c.attributes.title?' — '+c.attributes.title:''}`}),el('small',{text:`${group} · ${date(c.attributes.publishAt)}`})]))}if(!f.data.length)box.append(el('div',{class:'empty',text:'Belum ada chapter bahasa Indonesia.'}));const detail=el('section',{class:'shell'},[el('div',{class:'detail'},[el('img',{class:'cover',src:coverOf(m.data),alt:`Sampul ${titleOf(m.data)}`}),el('div',{},[el('span',{class:'eyebrow',text:'Manga bahasa Indonesia'}),el('h1',{text:titleOf(m.data)}),el('div',{class:'meta',text:a.status==='completed'?'Tamat':'Berjalan'})]),el('p',{class:'desc',text:a.description.id||a.description.en||'Deskripsi belum tersedia.'})]),el('div',{class:'bar'},[el('div',{},[el('h2',{text:'Daftar chapter'}),el('p',{text:`${f.total} chapter ditemukan`})])]),box]);layout(detail)}catch(e){showError(e)}}
async function read(id){loading(true);try{const [at,ch]=await Promise.all([request('/at-home/server/'+id),request(`/chapter/${id}?includes[]=manga`)]);const mangaRel=ch.data.relationships.find(x=>x.type==='manga');const name=mangaRel?.attributes?.title?.id||mangaRel?.attributes?.title?.en||`Chapter ${ch.data.attributes.chapter||'?'}`;localStorage.setItem('ruang-last',JSON.stringify({id,title:name,chapter:ch.data.attributes.chapter,at:Date.now()}));const hash=at.chapter.hash,files=at.chapter.dataSaver;const images=files.map((file,i)=>{const img=el('img',{src:`${at.baseUrl}/data-saver/${hash}/${file}`,alt:`Halaman ${i+1}`,loading:i<2?'eager':'lazy'});img.onerror=()=>img.alt=`Halaman ${i+1} gagal dimuat`;return img});const back=()=>location.hash=mangaRel?'#/manga/'+mangaRel.id:'#/';const idx=currentChapters.findIndex(x=>x.id===id),older=currentChapters[idx+1],newer=currentChapters[idx-1];app.className='reader';app.replaceChildren(el('div',{class:'readerbar'},[el('div',{class:'shell'},[el('button',{class:'pill',text:'← Daftar',onclick:back}),el('strong',{text:`${name} · Ch. ${ch.data.attributes.chapter||'?'}`}),el('span',{text:`${files.length} hlm`})])]),el('div',{class:'pages'},images),el('div',{class:'readernav'},[el('button',{class:'pill',text:'← Chapter lama',disabled:older?'':null,onclick:()=>location.hash='#/read/'+older.id}),el('button',{class:'pill',text:'Chapter baru →',disabled:newer?'':null,onclick:()=>location.hash='#/read/'+newer.id})]))}catch(e){showError(e,true)}}
function showError(e,dark=false){app.className=dark?'reader':'';app.replaceChildren(el('div',{class:'status'},[el('h2',{text:'Gagal memuat'}),el('p',{text:e.message}),el('button',{class:'pill',text:'Coba lagi',onclick:route})]))}
function route(){const p=location.hash.slice(1).split('?')[0].split('/').filter(Boolean);if(p[0]==='manga'&&p[1])manga(p[1]);else if(p[0]==='read'&&p[1])read(p[1]);else home()}addEventListener('hashchange',()=>{page=0;route()});route();
</script></body></html>
